plugins {
    id 'java-library'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.register('contractCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'router.ContractCheck'
}

tasks.named('check') {
    dependsOn 'contractCheck'
}

// The offline checks are Java entry points run by JavaExec.
tasks.named('test') {
    enabled = false
}

tasks.register('policyCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'router.PolicyCheck'
}

tasks.named('check') {
    dependsOn 'policyCheck'
}

tasks.register('invocationCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'router.InvocationCheck'
}

tasks.named('check') {
    dependsOn 'invocationCheck'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
}

tasks.register('providerCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'router.ProviderCheck'
}

tasks.named('check') {
    dependsOn 'providerCheck'
}

tasks.register('evaluationCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'router.EvaluationCheck'
}

tasks.named('check') {
    dependsOn 'evaluationCheck'
}

tasks.register('sample', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'router.Sample'
}

tasks.register('offlinePilot', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'router.Sample'
    args '--pilot'
}
